# docker/docker-compose.yml
# -------------------------
# Usage (from repo root playwright-framework/):
#   docker compose -f docker/docker-compose.yml run --rm playwright
#
# Provide env via .env.qa (gitignored) or Compose `environment`.

services:
  playwright:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: playwright-framework:local
    working_dir: /work
    environment:
      CI: "true"
      TEST_ENV: ${TEST_ENV:-qa}
      # Prefer injecting secrets at runtime instead of baking into the image:
      BASE_URL: ${BASE_URL:-}
      API_BASE_URL: ${API_BASE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      USER_EMAIL: ${USER_EMAIL:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      IGNORE_HTTPS_ERRORS: ${IGNORE_HTTPS_ERRORS:-false}
    volumes:
      # Persist reports/artifacts on the host after the container exits
      - ../reports:/work/reports
      - ../test-results:/work/test-results
    # Override command example:
    # command: ["npx", "playwright", "test", "--project=chromium", "tests/api"]
